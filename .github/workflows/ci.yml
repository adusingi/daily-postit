name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:

jobs:
  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Flutter tests
        working-directory: app
        run: flutter test

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: cli/go.sum
      - name: Go tests
        working-directory: cli
        run: go test ./...
